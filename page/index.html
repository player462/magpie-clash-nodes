<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>梯子节点</title>
  <link rel="stylesheet" href="style.css">
  <script src="_magpie/bridge.js"></script>
  <script src="app.js" defer></script>
</head>
<body>
  <main id="app">
    <header class="cn-head">
      <div class="cn-brand">
        <span class="cn-logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
            <circle cx="12" cy="12" r="3.1"></circle>
            <circle cx="12" cy="12" r="7.6" opacity=".55"></circle>
            <circle cx="12" cy="4.4" r="1.5" fill="currentColor" stroke="none"></circle>
            <circle cx="19.6" cy="12" r="1.5" fill="currentColor" stroke="none"></circle>
            <circle cx="12" cy="19.6" r="1.5" fill="currentColor" stroke="none"></circle>
            <circle cx="4.4" cy="12" r="1.5" fill="currentColor" stroke="none"></circle>
          </svg>
        </span>
        <div class="cn-titlebox">
          <h1>梯子节点</h1>
          <p class="cn-sub">给供应商、或它的每个账号，分别指定 Clash 节点</p>
        </div>
      </div>
      <div class="cn-head-right">
        <button type="button" class="cn-btn ghost cn-refresh" data-act="refresh" title="重新读取 Clash 订阅与节点">↻ 刷新</button>
        <span id="badge" class="cn-chip">载入中…</span>
      </div>
    </header>

    <section class="cn-bar">
      <label class="cn-field">
        <span>供应商</span>
        <select id="providerSelect"></select>
      </label>
      <label class="cn-field cn-field-grow">
        <span id="nodeLabel">节点</span>
        <select id="nodeSelect"></select>
      </label>
      <label class="cn-switch" title="开启后，这个供应商的每个账号可以各走一个节点">
        <input type="checkbox" id="perAccount">
        <i aria-hidden="true"></i>
        <span>按账号分配</span>
      </label>
      <div class="cn-bar-actions">
        <span id="dirty" class="cn-dirty" hidden>未保存</span>
        <button type="button" class="cn-btn primary" id="apply">应用</button>
        <button type="button" class="cn-btn ghost" id="restore">还原</button>
      </div>
    </section>

    <div id="status" class="cn-status"></div>

    <details id="pool" class="cn-pool">
      <summary><span id="poolSummary"></span></summary>
      <div id="poolBody"></div>
    </details>

    <section id="detail" class="cn-detail"></section>

    <p class="cn-foot">写入 magpie 的 <code>providers.json</code>，下一个请求即生效 · 「还原」恢复改动前的代理设置</p>
  </main>
